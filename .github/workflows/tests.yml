# Pruebas del juego en Chromium (npm test) en cada push y pull request a main.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56 aún no instala Chromium en 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # La versión publicada va empaquetada: también se prueba (menú y partidas)
      - run: npm run build
      - run: SITE_DIR=dist npx playwright test tests/menu.spec.js tests/match.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
