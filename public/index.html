<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1b0b33">
    <title>Tanques DS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>
    <canvas id="view"></canvas>

    <div id="hud" class="hud hidden">
        <div class="top">
            <div class="team team-p">
                <span class="tname"><span id="p-name">TÚ</span> <span id="p-power" class="power hidden">x2</span></span>
                <div class="pips" id="p-hp"></div>
            </div>
            <div class="team team-e">
                <span class="tname"><span id="e-power" class="power hidden">x2</span> <span id="e-name">RIVAL</span></span>
                <div class="pips" id="e-hp"></div>
            </div>
        </div>
        <div id="stealth" class="stealth">OCULTO</div>
        <div id="hint" class="hint">ARRASTRA PARA MOVER<br>SUELTA PARA DISPARAR</div>
    </div>

    <div id="banner" class="banner"></div>

    <div id="joy" class="joy hidden">
        <div class="joy-base"></div>
        <div class="joy-thumb"></div>
    </div>

    <div id="menu" class="screen">
        <h1 class="logo">
            <span>T</span><span>A</span><span>N</span><span>Q</span><span>U</span><span>E</span><span>S</span>
        </h1>
        <p class="tag">¡DUELO VOXEL!</p>
        <button id="btn-play" class="btn" disabled>CARGANDO...</button>
        <p class="help">
            MUÉVETE Y ERES INVISIBLE<br>
            PARA Y DISPARAS SOLO<br>
            <em>PERO DISPARAR TE DELATA</em>
        </p>
    </div>

    <div id="end" class="screen hidden">
        <h2 id="end-title" class="end-title">¡VICTORIA!</h2>
        <p id="end-sub" class="tag"></p>
        <button id="btn-again" class="btn">OTRA VEZ</button>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
