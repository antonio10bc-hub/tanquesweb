<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1b0b33">
    <title>Tank-less</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/favicon-64.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tank-less">
    <link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
</head>
<body>
    <canvas id="view"></canvas>

    <div id="hud" class="hud hidden">
        <div class="top">
            <div class="team team-p">
                <span class="tname" id="p-name">TÚ</span>
                <div class="pips" id="p-hp"></div>
            </div>
            <div class="team team-e">
                <span class="tname" id="e-name">RIVAL</span>
                <div class="pips" id="e-hp"></div>
            </div>
        </div>
        <div id="bossbar" class="bossbar hidden">
            <div id="bb-name" class="bb-name"></div>
            <div class="bb-track"><i id="bb-trail" class="bb-trail"></i><i id="bb-fill" class="bb-fill"></i><b class="bb-mark"></b></div>
        </div>
        <button id="btn-pause" class="pause-btn" aria-label="Pausa"><span></span><span></span></button>
        <div id="stealth" class="stealth">OCULTO</div>
        <div id="hint" class="hint">ARRASTRA PARA MOVER<br>SUELTA PARA DISPARAR</div>
    </div>

    <div id="banner" class="banner"></div>
    <div id="callout" class="callout"></div>

    <div id="stage" class="stage">
        <div id="stage-name" class="stage-name"></div>
        <div id="stage-sub" class="stage-sub"></div>
    </div>

    <div id="replay" class="replay hidden">
        <div class="bar-top"></div>
        <div class="bar-bottom"></div>
        <div class="replay-tag">REPETICIÓN</div>
    </div>

    <div id="joy" class="joy hidden">
        <div class="joy-base"></div>
        <div class="joy-thumb"></div>
    </div>

    <div id="menu" class="screen menu">
        <div class="coins-badge" aria-label="Monedas"><span class="coin"></span><span id="menu-coins">0</span></div>
        <button id="btn-settings" class="corner-btn">AJUSTES</button>
        <div class="menu-top">
        <h1 class="logo" aria-label="Tank-less">
            <span class="word"><span class="ch">T</span><span class="ch">A</span><span class="ch">N</span><span class="ch">K</span><span class="ch ghost">-</span><span class="ch ghost">L</span><span class="ch ghost">E</span><span class="ch ghost">S</span><span class="ch ghost">S</span></span>
        </h1>
            <div class="menu-row">
                <button id="btn-garage" class="items-btn" aria-label="Mi tanque">
                    <canvas width="56" height="56"></canvas>
                    <span>MI TANQUE</span>
                </button>
                <button id="btn-items" class="items-btn" aria-label="Objetos">
                    <canvas width="48" height="48"></canvas>
                    <span>OBJETOS</span>
                </button>
            </div>
            <button id="btn-trophies" class="btn btn-small trophy-btn"><span class="trophy"></span> LOGROS <span id="menu-trophies">0/0</span></button>
            <p class="help">
                MUÉVETE Y ERES INVISIBLE<br>
                PARA Y DISPARAS SOLO<br>
                <em>PERO DISPARAR TE DELATA</em>
            </p>
        </div>
        <div class="play-col">
            <button id="btn-play" class="btn" disabled>CARGANDO...</button>
            <button id="btn-campaign" class="btn btn-camp" disabled>CAMPAÑA</button>
            <button id="btn-survival" class="btn btn-alt" disabled>SUPERVIVENCIA</button>
        </div>
    </div>

    <!-- Campaña: el mapa se dibuja en el canvas del juego; esto es la interfaz encima -->
    <div id="campaign" class="campaign hidden">
        <button id="btn-campaign-back" class="corner-btn corner-left">VOLVER</button>
        <div id="camp-region" class="camp-region"></div>
        <div id="camp-card" class="camp-card">
            <div class="camp-head"><span id="camp-world" class="camp-world"></span><span id="camp-status" class="camp-status hidden"></span></div>
            <div id="camp-boss" class="camp-boss"></div>
            <div id="camp-tell" class="camp-tell"></div>
            <button id="camp-go" class="btn">¡A LUCHAR!</button>
        </div>
    </div>

    <div id="garage" class="screen garage hidden">
        <h2 class="end-title">MI TANQUE</h2>
        <div class="coins-badge static"><span class="coin"></span><span id="garage-coins">0</span></div>
        <div class="garage-stage">
            <button id="garage-prev" class="arrow" aria-label="Anterior">&lt;</button>
            <canvas id="garage-view" width="112" height="112"></canvas>
            <button id="garage-next" class="arrow" aria-label="Siguiente">&gt;</button>
        </div>
        <div id="garage-name" class="garage-name"></div>
        <div id="garage-count" class="garage-count"></div>
        <button id="garage-action" class="btn">USAR</button>
        <button id="btn-garage-close" class="btn btn-small">VOLVER</button>
    </div>

    <div id="trophies" class="screen glossary hidden">
        <h2 class="end-title">LOGROS</h2>
        <p id="trophies-count" class="tag"></p>
        <div id="trophies-list" class="glossary-list"></div>
        <button id="btn-trophies-close" class="btn btn-small">VOLVER</button>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Logro completado: baja desde arriba del todo, se queda un momento y vuelve a subir -->
    <div id="ach" class="ach">
        <div class="ach-icon"><i class="ach-trophy"></i><i class="spark"></i></div>
        <div class="ach-text">
            <div class="ach-head">¡LOGRO COMPLETADO!</div>
            <div id="ach-name" class="ach-name"></div>
            <div id="ach-desc" class="ach-desc"></div>
        </div>
    </div>

    <!-- Recompensa al ganar: moneda que aparece, vuela al contador y suma -->
    <div id="reward" class="reward hidden">
        <div class="reward-coin">
            <i class="spark" style="--x:-74px;--y:-50px"></i>
            <i class="spark" style="--x:66px;--y:-70px;animation-delay:.15s"></i>
            <i class="spark" style="--x:-86px;--y:34px;animation-delay:.3s"></i>
            <i class="spark" style="--x:78px;--y:44px;animation-delay:.1s"></i>
            <i class="spark" style="--x:-14px;--y:-96px;animation-delay:.25s"></i>
            <i class="spark" style="--x:6px;--y:86px;animation-delay:.4s"></i>
            <canvas class="big-coin" width="16" height="16"></canvas>
            <span class="reward-plus">+1</span>
        </div>
    </div>
    <div id="coin-counter" class="coins-badge coin-counter hidden"><span class="coin"></span><span id="hud-coins">0</span></div>

    <div id="glossary" class="screen glossary hidden">
        <h2 class="end-title">OBJETOS</h2>
        <div id="glossary-list" class="glossary-list"></div>
        <button id="btn-glossary-close" class="btn btn-small">VOLVER</button>
    </div>

    <div id="settings" class="screen settings hidden">
        <h2 class="end-title">AJUSTES</h2>
        <div class="toggles toggles-col">
            <button class="toggle" data-key="music">MÚSICA</button>
            <button class="toggle" data-key="sfx">SONIDO</button>
            <button class="toggle" data-key="vibration">VIBRACIÓN</button>
        </div>
        <button id="btn-settings-close" class="btn btn-small">VOLVER</button>
    </div>

    <div id="pause" class="screen hidden">
        <h2 class="end-title">PAUSA</h2>
        <button id="btn-resume" class="btn">SEGUIR</button>
        <div class="toggles">
            <button class="toggle" data-key="music">MÚSICA</button>
            <button class="toggle" data-key="sfx">SONIDO</button>
            <button class="toggle" data-key="vibration">VIBRACIÓN</button>
        </div>
        <button id="btn-quit" class="btn btn-small">SALIR AL MENÚ</button>
    </div>

    <div id="end" class="screen hidden">
        <h2 id="end-title" class="end-title">¡VICTORIA!</h2>
        <p id="end-sub" class="tag"></p>
        <button id="btn-again" class="btn">OTRA VEZ</button>
        <button id="btn-end-menu" class="btn btn-small">MENÚ PRINCIPAL</button>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
